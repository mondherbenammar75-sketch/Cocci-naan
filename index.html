<header>

</header>
<div class="wrap">

      <div class="total"><span data-i18n="total">Total</span><span id="total">0,00 €</span></div>
      <button class="primary" id="checkoutBtn">Valider et imprimer</button>
      <button class="secondary" id="clearBtn">Vider le panier</button>
    </aside>
  </div>
</div>
<section class="admin" id="admin">
  <h2 data-i18n="settings">Réglages protégés</h2>
  <p class="note" data-i18n="settingsNote">Modifiez les prix puis enregistrez. Les paramètres sont gardés sur cet appareil.</p>
  <div id="adminFields"></div>
  <button class="primary" id="saveBtn">Enregistrer les réglages</button>
  <button class="secondary" id="closeAdminBtn">Fermer</button>
</section>

 const orderHeading=`N° COMMANDE : ${orderNo}`;
 const customerTicket=`<div class="ticket-copy"><h2>COCCI NAAN</h2><div class="center" style="font-size:34px;font-weight:900">TICKET CAISSE / CLIENT</div><hr><div class="center" style="font-size:32px;font-weight:900;text-align:center">${esc(serviceLabel.toUpperCase())}</div><hr><div style="font-size:38px;font-weight:900">${orderHeading}</div><div style="font-size:27px;font-weight:900">${now.toLocaleDateString()} ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><hr>`+cart.map(i=>`<b style="font-size:34px;font-weight:900">${i.qty} x ${esc(txName(i.name))}</b><br><span style="font-size:29px;font-weight:900">${esc(detail(i))}</span><br><b style="font-size:32px;font-weight:900">${eur(i.price*i.qty)}</b><hr>`).join('')+`<h2 style="font-size:36px">${t('total')} ${eur(total)}</h2><div class="center" style="font-size:25px">${t('thankFood')}</div></div>`;
 const kitchenTicket=`<div class="ticket-copy"><h2 style="font-size:26px">COCCI NAAN</h2><div class="center" style="font-weight:900;font-size:26px">TICKET CUISINE</div><hr><div style="font-size:30px;font-weight:900">${orderHeading}</div><div style="font-size:22px;font-weight:900;text-align:center">${esc(serviceLabel.toUpperCase())}</div><hr>`+cart.map(i=>{const rows=[];if(i.cat==='Sandwichs')rows.push(['Pain',txName(i.bread)]);if(i.meat?.length)rows.push([i.cat==='Tacos'||i.cat==='Assiettes'?'Viande(s)':'',i.meat.map(txName).join(', ')]);if(i.crud?.length)rows.push(['Crudités',i.crud.map(txName).join(', ')]);if(i.crudAssiettes?.length)rows.push(['Crudités',i.crudAssiettes.map(txName).join(', ')]);if(i.sauce?.length)rows.push(['Sauces',i.sauce.map(txName).join(', ')]);if(i.supplements?.length)rows.push(['Suppléments',i.supplements.map(v=>txName(v.name)).join(', ')]);if(i.cat==='Paninis')rows.push(['Frites',i.fries==='Oui'?'Oui':'Non']);if(i.mode==='menu')rows.push(['Menu',txName(i.drink)]);return `<div class="kitchen-item"><div class="item-name">${i.qty} x ${esc(txName(i.name))}</div>`+rows.filter(x=>x[0]).map(([label,value])=>`<div class="field-label">${esc(label)} :</div><div class="field-value">${esc(value)}</div>`).join('')+`</div>`}).join('')+`</div>`;
 const css='<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:576px;max-width:576px;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:38px;line-height:1.22;font-weight:900}body{padding:1mm}h2{text-align:center;font-size:42px;line-height:1.15;margin:8px 0;font-weight:900}.center{text-align:center;font-weight:900}hr{border:0;border-top:3px dashed #000;margin:10px 0}.ticket-copy{width:100%;padding-bottom:4mm;font-size:38px;line-height:1.22;font-weight:900;overflow-wrap:anywhere}.ticket-copy b{font-size:39px;font-weight:900}.kitchen-item{margin:0 0 16px;padding-bottom:13px;border-bottom:3px dashed #000}.kitchen-item .item-name{font-size:43px;font-weight:900;line-height:1.15;margin-bottom:10px;overflow-wrap:anywhere}.kitchen-item .field-label{font-weight:900;font-size:36px;margin-top:8px}.kitchen-item .field-value{font-size:39px;font-weight:900;overflow-wrap:anywhere}</style>';
 const wrapTicket=(ticket)=>'<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="format-detection" content="telephone=no">'+css+'</head><body>'+ticket+'</body></html>';
 pendingPrintHtml.customer=wrapTicket(customerTicket);pendingPrintHtml.kitchen=wrapTicket(kitchenTicket);pendingPrintOrderNo=orderNo;
 document.getElementById('orderOverlay').innerHTML=`<div style="width:100%;max-width:520px"><p>Commande enregistrée</p><div class="order-number">${orderNo}</div><p>اختار التذكرة اللي تحب تطبعها</p><button class="print-choice" onclick="printOneTicket('customer')">🧾 Ticket caisse / client</button><button class="print-choice secondary-choice" onclick="printOneTicket('kitchen')">👨‍🍳 Ticket cuisine</button><button class="print-choice done-choice" onclick="finishOrder()">Terminer la commande</button><p style="font-size:16px">كل تذكرة تطبع وحدها. تنجم تطبع الزوز بالضغط على كل زر.</p></div>`;
 document.getElementById('orderOverlay').classList.add('show');
}

function openAdmin(){const pin=prompt(t('adminCode'));if(pin===null)return;if(pin!=='2468'){alert(t('wrongCode'));return}renderAdmin();document.getElementById('admin').classList.add('show');document.getElementById('admin').scrollIntoView({behavior:'smooth'})}
document.getElementById('adminOpen').addEventListener('click',openAdmin);
document.getElementById('closeAdminBtn').addEventListener('click',()=>document.getElementById('admin').classList.remove('show'));
function renderAdmin(){
 const root=document.getElementById('adminFields');let html=`<div class="section"><h3>Logo du restaurant</h3><label>Choisir le logo<input type="file" accept="image/*" onchange="setRestaurantLogo(this)"></label><button class="secondary" onclick="removeRestaurantLogo()">Supprimer le logo</button></div><div class="section"><h3>${t('menuExtra')}</h3><label>${t('menuExtra')}<input type="number" min="0" step=".1" id="menuExtraInput" value="${menuExtra}"></label><p class="note">${t('menuInfo')}</p></div>`;
 html+=`<div class="section"><h3>Ajouter une catégorie</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="newCategoryName" placeholder="Nom de la catégorie" style="flex:1;min-width:150px"><input id="newCategoryEmoji" placeholder="Emoji (ex. 🍰)" style="width:130px"><button class="choice" onclick="addCategory()">＋ Ajouter catégorie</button></div></div>`;
 for(const [cat,[emoji,items]] of Object.entries(catalog)){
  html+=`<div class="section"><h3>${emoji} ${esc(txCat(cat))}</h3><div style="display:flex;gap:6px;margin:6px 0 12px"><button type="button" class="secondary" onclick="moveCategory('${esc(cat)}',-1)">↑ Monter</button><button type="button" class="secondary" onclick="moveCategory('${esc(cat)}',1)">↓ Descendre</button></div><label>Photo de la catégorie<input type="file" accept="image/*" onchange="setCategoryPhoto('${esc(cat)}',this)"></label><button type="button" class="secondary" onclick="removeCategoryPhoto('${esc(cat)}')">Supprimer photo catégorie</button><button type="button" class="secondary" onclick="removeCategory('${esc(cat)}')">Supprimer catégorie</button><div class="section"><h4>Personnaliser les choix de cette catégorie</h4><div style="display:flex;gap:12px;flex-wrap:wrap">${[['bread','Type de pain'],['crud','Crudités'],['sauce','Sauces'],['meat','Viandes'],['crudAssiettes','Crudités des assiettes'],['fries','Frites']].map(([key,label])=>`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${((categoryOptions[cat]||[]).includes(key))?'checked':''} onchange="toggleCategoryOption('${esc(cat)}','${key}',this.checked)">${label}</label>`).join('')}</div><p class="note">Cochez les choix que vous voulez proposer quand un client commande dans cette catégorie.</p></div><div class="fields">${items.map(([name],idx)=>`<label><div style="display:flex;gap:4px;align-items:center;justify-content:space-between"><strong>${esc(txName(name))}</strong><span><button type="button" class="secondary" onclick="moveProduct('${esc(cat)}','${esc(name)}',-1)">↑</button><button type="button" class="secondary" onclick="moveProduct('${esc(cat)}','${esc(name)}',1)">↓</button></span></div><input type="number" min="0" step=".1" data-price-name="${encodeURIComponent(name)}" value="${Number(prices[name]||0)}"><span>Photo du produit</span>${productPhotos[name]?`<img src="${productPhotos[name]}" alt="" style="width:90px;height:70px;object-fit:cover;border-radius:8px">`:''}<input type="file" accept="image/*" onchange="setProductPhoto('${esc(name)}',this)"><button type="button" class="secondary" onclick="removeProductPhoto('${esc(name)}')">🖼 Supprimer la photo</button><button type="button" class="secondary" onclick="removeProduct('${esc(cat)}','${esc(name)}')">🗑 ${t('deleteProduct')}</button></label>`).join('')}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="newName_${encodeURIComponent(cat)}" placeholder="${t('newProduct')}" style="flex:2;min-width:150px"><input id="newPrice_${encodeURIComponent(cat)}" type="number" min="0" step=".1" placeholder="${t('newPrice')}" style="width:150px"><button class="choice" onclick="addProduct('${esc(cat)}')">${t('addProduct')}</button></div></div>`;
 }
 html+=`<div class="section"><h3>${t('options')}</h3>`;
 html+=optionAdmin('menuDrinks',menuDrinks,t('drinks'));
 html+=optionAdmin('crud',crud,t('crud'));
 html+=optionAdmin('crudAssiettes',crudAssiettes,t('plateCrudTitle'));
 html+=optionAdmin('sauces',sauces,t('sauces'));
 html+=`<h3 style="margin-top:20px">${t('supplements')}</h3><div class="fields">${supplements.map(([name,price],i)=>`<label>${esc(txName(name))}<input type="number" min="0" step=".1" value="${Number(price)||0}" onchange="changeSupplementPrice(${i},this.value)"><button class="secondary" onclick="removeSupplement(${i})">🗑 ${t('delete')}</button></label>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="newSuppName" placeholder="${t('productName')}" style="flex:1;min-width:150px"><input id="newSuppPrice" type="number" min="0" step=".1" placeholder="${t('price')}" style="width:130px"><button class="choice" onclick="addSupplement()">${t('add')}</button></div></div>`;
 root.innerHTML=html;
}
function optionAdmin(which,arr,title){return `<div class="section"><h3>${title}</h3><div class="option-list">${arr.map((v,i)=>`<div class="option-row"><span>${esc(txName(v))}</span><button class="secondary" onclick="removeOption('${which}',${i})">🗑 ${t('delete')}</button></div>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="add_${which}" placeholder="${t('productName')}" style="flex:1;min-width:150px"><button class="choice" onclick="addOption('${which}')">＋ ${t('add')}</button></div></div>`}
function toggleCategoryOption(cat,key,enabled){if(!categoryOptions[cat])categoryOptions[cat]=[];categoryOptions[cat]=categoryOptions[cat].filter(v=>v!==key);if(enabled)categoryOptions[cat].push(key);saveAll();}
function addCategory(){const n=document.getElementById('newCategoryName'),e=document.getElementById('newCategoryEmoji'),name=n.value.trim(),emoji=e.value.trim()||'🍽️';if(!name){alert(t('enterName'));return}if(catalog[name]){alert(t('productExists'));return}catalog[name]=[emoji,[]];saveAll();renderAdmin();render()}
function moveCategory(name,dir){const keys=Object.keys(catalog),i=keys.indexOf(name),j=i+dir;if(j<0||j>=keys.length)return;const ordered={};keys.forEach((k,n)=>{const target=n===i?keys[j]:n===j?keys[i]:k;ordered[target]=catalog[target]});catalog=ordered;saveAll();renderAdmin();render()}
function moveProduct(cat,name,dir){if(!catalog[cat])return;const a=catalog[cat][1],i=a.findIndex(v=>v[0]===name),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];saveAll();renderAdmin();render()}
function removeCategory(name){if(!catalog[name])return;if(!confirm('Supprimer la catégorie « '+name+' » et ses produits ?'))return;for(const [n] of catalog[name][1]){delete prices[n];delete productPhotos[n]}delete catalog[name];delete categoryOptions[name];delete categoryPhotos[name];localStorage.setItem('ff_product_photos',JSON.stringify(productPhotos));localStorage.setItem('ff_category_photos',JSON.stringify(categoryPhotos));saveAll();renderAdmin();render()}
function addProduct(cat){
 const n=document.getElementById('newName_'+encodeURIComponent(cat)),p=document.getElementById('newPrice_'+encodeURIComponent(cat)),name=n.value.trim(),price=Math.max(0,Number(p.value)||0);
 if(!name){alert(t('enterName'));return}
 if(Object.values(catalog).some(c=>c[1].some(item=>item[0].toLowerCase()===name.toLowerCase()))){alert(t('productExists'));return}
 catalog[cat][1].push([name,price]);prices[name]=price;saveAll();renderAdmin();render();
}
function removeProduct(cat,name){if(!catalog[cat])return;if(!confirm(format(t('deleteAsk'),{name:txName(name)})))return;catalog[cat][1]=catalog[cat][1].filter(p=>p[0]!==name);delete prices[name];saveAll();renderAdmin();render()}
function addOption(which){const el=document.getElementById('add_'+which),value=el?.value.trim();if(!value){alert(t('enterName'));return}const arr=which==='menuDrinks'?menuDrinks:which==='crudAssiettes'?crudAssiettes:which==='crud'?crud:sauces;if(arr.some(v=>v.toLowerCase()===value.toLowerCase())){alert(t('productExists'));return}arr.push(value);saveAll();renderAdmin()}
function removeOption(which,index){const arr=which==='menuDrinks'?menuDrinks:which==='crudAssiettes'?crudAssiettes:which==='crud'?crud:sauces;if(!arr[index])return;if(!confirm(format(t('deleteAsk'),{name:txName(arr[index])})))return;arr.splice(index,1);saveAll();renderAdmin()}
function addSupplement(){const n=document.getElementById('newSuppName'),p=document.getElementById('newSuppPrice'),name=n.value.trim(),price=Math.max(0,Number(p.value)||0);if(!name){alert(t('enterName'));return}if(supplements.some(v=>v[0].toLowerCase()===name.toLowerCase())){alert(t('productExists'));return}supplements.push([name,price]);saveAll();renderAdmin()}
function changeSupplementPrice(i,v){if(!supplements[i])return;supplements[i][1]=Math.max(0,Number(v)||0);saveAll();renderAdmin()}
function removeSupplement(i){if(!supplements[i])return;if(!confirm(format(t('deleteAsk'),{name:supplements[i][0]})))return;supplements.splice(i,1);saveAll();renderAdmin()}
document.getElementById('saveBtn').addEventListener('click',()=>{
 document.querySelectorAll('[data-price-name]').forEach(el=>prices[decodeURIComponent(el.dataset.priceName)]=Math.max(0,Number(el.value)||0));
 const me=document.getElementById('menuExtraInput');if(me)menuExtra=Math.max(0,Number(me.value)||0);
 saveAll();document.getElementById('admin').classList.remove('show');render();alert(t('saveDone'));
});
document.getElementById('checkoutBtn').addEventListener('click',checkout);
document.getElementById('clearBtn').addEventListener('click',clearCart);
renderBrand();
render();
</script>
