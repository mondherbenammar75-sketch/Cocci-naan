
name: Build COCCI NAAN APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o COCCI_NAAN_Android_Studio.zip

      - name: Build APK
        working-directory: COCCI_NAAN_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COCCI-NAAN-APK
          path: COCCI_NAAN_Android/app/build/outputs/apk/debug/app-debug.apk
